<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Pastilla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B4735">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    function mostrarEnCaja(texto) {
      const intentar = () => {
        const caja = document.getElementById("diagnostico-onesignal");
        if (caja) {
          caja.innerHTML = texto;
        } else {
          setTimeout(intentar, 300);
        }
      };
      intentar();
    }

    try {
      mostrarEnCaja("Iniciando OneSignal...");
      await OneSignal.init({
        appId: "2bf8ee09-a009-49a5-8a61-24257be0e1b0",
        serviceWorkerParam: { scope: "/Pastillero/" },
        serviceWorkerPath: "OneSignalSDKWorker.js",
      });
      mostrarEnCaja("Init completado, leyendo estado...");

      function actualizarDiagnostico() {
        const permiso = OneSignal.Notifications.permission;
        const suscrito = OneSignal.User.PushSubscription.optedIn;
        const id = OneSignal.User.PushSubscription.id;
        const token = OneSignal.User.PushSubscription.token;
        mostrarEnCaja(
          "Permiso navegador: " + permiso + "<br>" +
          "Suscrito en OneSignal: " + suscrito + "<br>" +
          "ID de suscripción: " + (id || "(ninguno todavía)") + "<br>" +
          "Token: " + (token ? "sí tiene" : "no tiene")
        );
      }

      OneSignal.User.PushSubscription.addEventListener("change", actualizarDiagnostico);
      actualizarDiagnostico();
    } catch (error) {
      mostrarEnCaja("ERROR al iniciar: " + (error && error.message ? error.message : String(error)));
      console.error("Error OneSignal init:", error);
    }
  });
</script>
<style>
  :root {
    --verde-oscuro: #2B4735;
    --verde-medio: #4C7A5E;
    --crema: #F6F3EC;
    --ambar: #C97A2B;
    --texto: #22301F;
    --gris: #8A9086;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--crema);
    color: var(--texto);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    overscroll-behavior-y: contain;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 20px 40px;
  }

  header {
    text-align: center;
    padding: 16px 0 8px;
  }

  header .fecha {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gris);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  header h1 {
    font-size: 26px;
    font-weight: 400;
    margin-top: 4px;
    color: var(--verde-oscuro);
  }

  .estado-hoy {
    text-align: center;
    margin: 28px 0 8px;
    font-size: 15px;
    color: var(--gris);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    min-height: 20px;
  }

  .boton-toma {
    position: relative;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    margin: 8px auto 32px;
    border: none;
    cursor: pointer;
    background: var(--verde-oscuro);
    color: var(--crema);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(43, 71, 53, 0.25);
    transition: transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease;
  }

  .boton-toma:active {
    transform: scale(0.96);
  }

  .boton-toma.tomada {
    background: var(--ambar);
    box-shadow: 0 8px 24px rgba(201, 122, 43, 0.3);
  }

  .boton-toma .marca {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(246, 243, 236, 0.35);
    margin: 12px;
  }

  .racha {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: var(--verde-medio);
    margin-bottom: 32px;
  }

  .racha strong {
    color: var(--verde-oscuro);
    font-size: 16px;
  }

  section.historial h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gris);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(43, 71, 53, 0.12);
  }

  .fila-dia {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 1px solid rgba(43, 71, 53, 0.08);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .fila-dia:last-child { border-bottom: none; }

  .fila-dia .dia-nombre {
    font-size: 15px;
  }

  .fila-dia .dia-nombre .num {
    color: var(--gris);
    font-size: 13px;
    margin-left: 4px;
  }

  .punto-estado {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .punto-estado.si { background: var(--verde-medio); }
  .punto-estado.no { background: transparent; border: 2px solid rgba(138, 144, 134, 0.4); }

  footer {
    margin-top: auto;
    padding-top: 24px;
    text-align: center;
  }

  .borrar {
    background: none;
    border: none;
    color: var(--gris);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: var(--verde-oscuro);
    color: var(--crema);
    padding: 12px 20px;
    border-radius: 30px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="fecha" id="fecha-larga">Cargando</div>
    <h1>Tu pastilla</h1>
  </header>

  <div class="estado-hoy" id="estado-hoy"></div>

  <button class="boton-toma" id="boton-toma">
    <span class="marca"></span>
    <span id="texto-boton">Tomada hoy</span>
  </button>

  <div class="racha" id="racha"></div>

  <section class="historial">
    <h2>Últimos 14 días</h2>
    <div id="lista-historial"></div>
  </section>

  <footer>
    <button class="borrar" id="borrar-todo">Borrar historial</button>
  </footer>

  <div style="margin-top:24px; padding:14px; border:1px solid #ccc; border-radius:10px; font-family:monospace; font-size:12px; background:#fff;">
    <strong>Diagnóstico de notificaciones</strong>
    <div id="diagnostico-onesignal">Cargando...</div>
    <button id="boton-forzar-suscripcion" style="margin-top:10px; padding:8px 12px;">Forzar suscripción</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
document.getElementById("boton-forzar-suscripcion").addEventListener("click", async () => {
  try {
    await OneSignal.User.PushSubscription.optIn();
    alert("Solicitud enviada, revisa el diagnóstico.");
  } catch (error) {
    alert("Error: " + error.message);
  }
});
</script>

<script>
const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function claveDia(fecha) {
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth() + 1).padStart(2, '0');
  const d = String(fecha.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function cargarRegistro() {
  try {
    const guardado = localStorage.getItem('pastilla-registro');
    return guardado ? JSON.parse(guardado) : {};
  } catch (e) {
    return {};
  }
}

function guardarRegistro(registro) {
  localStorage.setItem('pastilla-registro', JSON.stringify(registro));
}

const FIREBASE_URL = 'https://despensa-granon-default-rtdb.europe-west1.firebasedatabase.app';

let registro = cargarRegistro();
const hoy = new Date();
const claveHoy = claveDia(hoy);

async function sincronizarConFirebase() {
  try {
    const resp = await fetch(FIREBASE_URL + '/pastilla.json');
    const remoto = await resp.json();
    if (remoto) {
      registro = Object.assign({}, remoto, registro);
      guardarRegistro(registro);
      refrescarTodo();
    }
  } catch (e) {
    // Sin conexión, seguimos con los datos locales
  }
}

async function subirAFirebase() {
  try {
    await fetch(FIREBASE_URL + '/pastilla.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(registro)
    });
  } catch (e) {
    // Sin conexión, se sube en la próxima sincronización
  }
}

function mostrarToast(texto) {
  const toast = document.getElementById('toast');
  toast.textContent = texto;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 1800);
}

function actualizarFecha() {
  const nombreDia = DIAS_SEMANA[hoy.getDay()];
  const texto = `${nombreDia}, ${hoy.getDate()} de ${MESES[hoy.getMonth()]}`;
  document.getElementById('fecha-larga').textContent = texto;
}

function actualizarBoton() {
  const boton = document.getElementById('boton-toma');
  const textoBoton = document.getElementById('texto-boton');
  const estadoHoy = document.getElementById('estado-hoy');
  const tomada = !!registro[claveHoy];

  if (tomada) {
    boton.classList.add('tomada');
    textoBoton.textContent = 'Tomada';
    const hora = registro[claveHoy];
    estadoHoy.textContent = `Marcada hoy a las ${hora}`;
  } else {
    boton.classList.remove('tomada');
    textoBoton.textContent = 'Tomada hoy';
    estadoHoy.textContent = 'Todavía no la has marcado hoy';
  }
}

function calcularRacha() {
  let racha = 0;
  let cursor = new Date(hoy);
  while (true) {
    const clave = claveDia(cursor);
    if (registro[clave]) {
      racha++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return racha;
}

function actualizarRacha() {
  const racha = calcularRacha();
  const el = document.getElementById('racha');
  if (racha === 0) {
    el.textContent = 'Empieza hoy tu racha';
  } else if (racha === 1) {
    el.innerHTML = '<strong>1 día</strong> seguido';
  } else {
    el.innerHTML = `<strong>${racha} días</strong> seguidos`;
  }
}

function actualizarHistorial() {
  const lista = document.getElementById('lista-historial');
  lista.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const fecha = new Date(hoy);
    fecha.setDate(fecha.getDate() - i);
    const clave = claveDia(fecha);
    const tomada = !!registro[clave];
    const nombreDia = i === 0 ? 'Hoy' : DIAS_SEMANA[fecha.getDay()];

    const fila = document.createElement('div');
    fila.className = 'fila-dia';
    fila.innerHTML = `
      <span class="dia-nombre">${nombreDia}<span class="num">${fecha.getDate()}/${fecha.getMonth() + 1}</span></span>
      <span class="punto-estado ${tomada ? 'si' : 'no'}"></span>
    `;
    lista.appendChild(fila);
  }
}

function refrescarTodo() {
  actualizarBoton();
  actualizarRacha();
  actualizarHistorial();
}

document.getElementById('boton-toma').addEventListener('click', () => {
  if (registro[claveHoy]) {
    delete registro[claveHoy];
    mostrarToast('Toma desmarcada');
  } else {
    const horaActual = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    registro[claveHoy] = horaActual;
    mostrarToast('Pastilla marcada como tomada');
  }
  guardarRegistro(registro);
  refrescarTodo();
  subirAFirebase();
});

document.getElementById('borrar-todo').addEventListener('click', () => {
  if (confirm('¿Seguro que quieres borrar todo el historial?')) {
    registro = {};
    guardarRegistro(registro);
    refrescarTodo();
    subirAFirebase();
    mostrarToast('Historial borrado');
  }
});

actualizarFecha();
refrescarTodo();
sincronizarConFirebase();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
