name: Recordatorio pastilla

on:
  schedule:
    - cron: '7 21 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch: {}

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar y avisar si hace falta
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scripts/recordatorio.js
