name: Recordatorio pastilla

on:
  schedule:
    - cron: '7 21 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Escribe "si" para forzar la comprobación sin importar la hora'
        required: false
        default: 'no'

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar y avisar si hace falta
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: node scripts/recordatorio.js
